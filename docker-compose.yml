services:
  postgres:
    image: postgres:16-alpine
    container_name: barista-postgres
    restart: always
    environment:
      POSTGRES_USER: barista
      POSTGRES_PASSWORD: baristasecret
      POSTGRES_DB: barista_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barista -d barista_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barista-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://barista:baristasecret@postgres:5432/barista_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NODE_ENV=production

volumes:
  postgres_data:
