name: CI & CD

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute build variables
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=master-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache node modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run test suite
        run: npm test

      - name: Build Next.js app
        run: npm run build

  publish-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push barista container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/csp33/barista:latest
            ghcr.io/csp33/barista:${{ github.sha }}
            ghcr.io/csp33/barista:${{ needs.build-test.outputs.image_tag }}
          cache-from: type=registry,ref=ghcr.io/csp33/barista:buildcache
          cache-to: type=registry,ref=ghcr.io/csp33/barista:buildcache,mode=max

  update-k8s-helm-values:
    name: Bump barista image tag in k8s-at-home-charts
    runs-on: ubuntu-latest
    needs: [build-test, publish-image]
    if: |
      always() &&
      !cancelled() &&
      needs.publish-image.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Check K8S_CHARTS_REPO_TOKEN secret
        id: check-token
        run: |
          if [ -z "${{ secrets.K8S_CHARTS_REPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::K8S_CHARTS_REPO_TOKEN secret is not configured in this repository. Skipping automatic helm values bump."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.has_token == 'true'
        with:
          repository: csp33/k8s-at-home-charts
          ref: master
          token: ${{ secrets.K8S_CHARTS_REPO_TOKEN }}
          path: charts

      - name: Set image.tag in barista values
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: charts
        env:
          TAG: ${{ needs.build-test.outputs.image_tag }}
        run: |
          TARGET="charts/barista/values.yaml"
          echo "Bumping ${TARGET} to ${TAG}"
          yq eval -i '.image.tag = strenv(TAG)' "${TARGET}"

      - name: Commit and push
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: charts
        env:
          TAG: ${{ needs.build-test.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/barista/values.yaml
          if git diff --cached --quiet; then
            echo "No change to charts/barista/values.yaml (tag already ${TAG})."
            exit 0
          fi
          git commit -m "chore(barista): bump image tag to ${TAG}"
          git push origin HEAD:master
