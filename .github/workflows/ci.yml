name: CI & CD

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barista
          POSTGRES_PASSWORD: baristasecret
          POSTGRES_DB: barista_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://barista:baristasecret@localhost:5432/barista_db
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute build variables
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=master-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache node modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barista
          POSTGRES_PASSWORD: baristasecret
          POSTGRES_DB: barista_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://barista:baristasecret@localhost:5432/barista_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Auto-commit updated README screenshots
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "README screenshots are already up to date."
            exit 0
          fi
          git commit -m "docs(screenshots): auto-update README screenshots from Playwright E2E [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [build-test, e2e-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push barista container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/csp33/barista:latest
            ghcr.io/csp33/barista:${{ github.sha }}
            ghcr.io/csp33/barista:${{ needs.build-test.outputs.image_tag }}
          cache-from: type=registry,ref=ghcr.io/csp33/barista:buildcache
          cache-to: type=registry,ref=ghcr.io/csp33/barista:buildcache,mode=max

  update-k8s-helm-values:
    name: Bump barista image tag in k8s-at-home-charts
    runs-on: ubuntu-latest
    needs: [build-test, publish-image]
    if: |
      always() &&
      !cancelled() &&
      needs.publish-image.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Check K8S_CHARTS_REPO_TOKEN secret
        id: check-token
        run: |
          if [ -z "${{ secrets.K8S_CHARTS_REPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::K8S_CHARTS_REPO_TOKEN secret is not configured in this repository. Skipping automatic helm values bump."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.has_token == 'true'
        with:
          repository: csp33/k8s-at-home-charts
          ref: master
          token: ${{ secrets.K8S_CHARTS_REPO_TOKEN }}
          path: charts

      - name: Set image.tag in barista values
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: charts
        env:
          TAG: ${{ needs.build-test.outputs.image_tag }}
        run: |
          TARGET="charts/barista/values.yaml"
          echo "Bumping ${TARGET} to ${TAG}"
          yq eval -i '.image.tag = strenv(TAG)' "${TARGET}"

      - name: Commit and push
        if: steps.check-token.outputs.has_token == 'true'
        working-directory: charts
        env:
          TAG: ${{ needs.build-test.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/barista/values.yaml
          if git diff --cached --quiet; then
            echo "No change to charts/barista/values.yaml (tag already ${TAG})."
            exit 0
          fi
          git commit -m "chore(barista): bump image tag to ${TAG}"
          git push origin HEAD:master
